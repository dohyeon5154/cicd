name: test                     # 워크플로의 표시 이름

on:                            # 워크플로를 트리거(실행)할 이벤트 정의
  push:
    branches: [main]           # main 브랜치로 push 발생 시 실행
  pull_request:
    branches: [main]           # main 브랜치를 대상으로 한 PR 생성/갱신 시 실행

jobs:
  test:
    runs-on: ${{ matrix.os }}              # matrix 변수에 따라 OS 동적 할당
    strategy:
      fail-fast: true                     # 하나라도 실패하면 나머지 실행 중인 job 즉시 취소
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }} # 파이썬 버전 동적 주입
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -v